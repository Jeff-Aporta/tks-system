<!DOCTYPE html>
<html lang="es" class="theme-dark" data-theme="dark" data-palette="contapyme">
<head>
  <meta charset="UTF-8">
  <script src="../preview-boot.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>tk-sequence · demo</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/Jeff-Aporta/is-webcomponents@1c0e451393a412c2c5a41d1d4d4a2e62aa662bda/dist/cdn/is-base.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/Jeff-Aporta/is-webcomponents@1c0e451393a412c2c5a41d1d4d4a2e62aa662bda/dist/cdn/palettes.min.css">
  <link rel="stylesheet" href="../styles/preview.css">
  <script type="module" src="https://cdn.jsdelivr.net/gh/Jeff-Aporta/is-webcomponents@1c0e451393a412c2c5a41d1d4d4a2e62aa662bda/dist/cdn/all.min.js"></script>
  <script type="module" src="../../../../dist/cdn/tk.all.js"></script>
  <script type="module" src="../preview-chrome.js"></script>
</head>
<body>
  <main class="demo">
    <header>
      <h1>&lt;tk-sequence&gt;</h1>
      <p>Bloque <code>sequence</code>. El payload pasa tal cual a <code>is-sequence-diagram</code>: <code>actors</code>, <code>groups</code>, <code>messages</code>.</p>
    </header>

    <section class="demo">
      <h2>Demo en vivo</h2>
      <div class="marco">
        <tk-sequence id="sq"></tk-sequence>
      </div>
    </section>

    <script type="module">
      document.getElementById('sq').payload = {
        title: 'Flujo del cambio',
        subtitle: 'Solicitud → análisis → fix → verificación',
        sequence: {
          actors: [
            { id: 'u',  label: 'Usuario', icon: 'mdi:account' },
            { id: 'w',  label: 'Worker',  icon: 'mdi:cloud' },
            { id: 'd1', label: 'D1',      icon: 'mdi:database' },
          ],
          groups: [
            { label: 'Antes', items: ['m1', 'm2'] },
            { label: 'Fix',   items: ['m3', 'm4'] },
          ],
          messages: [
            { from: 'u',  to: 'w',  label: 'GET /tickets',  kind: 'sync',  group: 'm1' },
            { from: 'w',  to: 'd1', label: 'SELECT json_agg…', kind: 'sync', group: 'm2' },
            { from: 'd1', to: 'w',  label: 'SQLITE_ERROR',  kind: 'error', group: 'm2' },
            { from: 'w',  to: 'd1', label: 'SELECT json_group_array…', kind: 'sync', group: 'm3' },
            { from: 'd1', to: 'w',  label: '[tickets]',     kind: 'return', group: 'm3' },
            { from: 'w',  to: 'u',  label: '200 OK',        kind: 'return', group: 'm4' },
          ],
        },
      };
    </script>
  </main>
</body>
</html>
