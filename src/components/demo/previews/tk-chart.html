<!DOCTYPE html>
<html lang="es" class="theme-dark" data-theme="dark" data-palette="contapyme">
<head>
  <meta charset="UTF-8">
  <script src="../preview-boot.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>tk-chart · demo</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/Jeff-Aporta/is-webcomponents@1c0e451393a412c2c5a41d1d4d4a2e62aa662bda/dist/cdn/is-base.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/Jeff-Aporta/is-webcomponents@1c0e451393a412c2c5a41d1d4d4a2e62aa662bda/dist/cdn/palettes.min.css">
  <link rel="stylesheet" href="../styles/preview.css">
  <script type="module" src="https://cdn.jsdelivr.net/gh/Jeff-Aporta/is-webcomponents@1c0e451393a412c2c5a41d1d4d4a2e62aa662bda/dist/cdn/all.min.js"></script>
  <script type="module" src="../../../../dist/cdn/tk.all.js"></script>
  <script type="module" src="../preview-chrome.js"></script>
</head>
<body>
  <main class="demo">
    <header>
      <h1>&lt;tk-chart&gt;</h1>
      <p>Bloque <code>chart</code>. Payload con forma <code>Chart.js</code>: <code>type</code>, <code>data</code> + <code>options</code>. <code>title</code> y <code>subtitle</code> del plugin se extraen al documento para que escalen bien.</p>
    </header>

    <section class="demo">
      <h2>Bar chart</h2>
      <div class="marco">
        <tk-chart id="ch"></tk-chart>
      </div>
    </section>

    <script type="module">
      document.getElementById('ch').payload = {
        chart: {
          type: 'bar',
          data: {
            labels: ['Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov'],
            datasets: [{
              label: 'Tickets cerrados',
              data: [42, 48, 53, 61, 68, 74],
              backgroundColor: 'rgba(26, 110, 176, 0.7)',
              borderColor: '#1a6eb0',
              borderWidth: 1,
            }],
          },
          options: {
            plugins: {
              title: { text: 'Tickets cerrados por mes', display: false },
              legend: { display: false },
            },
            responsive: true,
            maintainAspectRatio: false,
          },
        },
      };
    </script>
  </main>
</body>
</html>
