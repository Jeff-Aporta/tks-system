<!DOCTYPE html>
<html lang="es" class="theme-dark" data-theme="dark" data-palette="contapyme">
<head>
  <meta charset="UTF-8">
  <script src="../preview-boot.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>tk-stepper · demo</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/Jeff-Aporta/is-webcomponents@main/dist/cdn/is-base.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/Jeff-Aporta/is-webcomponents@main/dist/cdn/palettes.min.css">
  <link rel="stylesheet" href="../styles/preview.css">
  <script type="module" src="https://cdn.jsdelivr.net/gh/Jeff-Aporta/is-webcomponents@main/dist/cdn/all.min.js"></script>
  <script type="module" src="../../../../dist/cdn/tk.all.js"></script>
  <script type="module" src="../preview-chrome.js"></script>
</head>
<body>
  <main class="demo">
    <header>
      <h1>&lt;tk-stepper&gt;</h1>
      <p>Bloque <code>mui-stepper</code> (alias: <code>stepper</code>). Procedimiento paso a paso en vertical. <code>active = total</code>: el procedimiento está documentado, ningún paso queda pendiente.</p>
    </header>

    <section class="demo">
      <h2>Demo en vivo</h2>
      <div class="marco">
        <tk-stepper id="st"></tk-stepper>
      </div>
    </section>

    <script type="module">
      document.getElementById('st').payload = {
        title: 'Cómo verificar el fix',
        stepper: {
          steps: [
            { id: 1, icon: 'mdi:cloud-sync-outline', label: 'Deploy', description: 'Publica el commit con la migración. Espera a que `wrangler tail` muestre el primer hit sin 503.' },
            { id: 2, icon: 'mdi:api',                label: 'Curl /api/tk/patyia/tickets', description: 'Debe devolver la lista de tickets en menos de 1 s.' },
            { id: 3, icon: 'mdi:check-decagram',     label: 'Smoke', description: 'Abre un ticket en el visor. Revisa que la cabecera + los bloques se rendericen sin warnings en la consola.' },
          ],
        },
      };
    </script>
  </main>
</body>
</html>
