<!DOCTYPE html>
<html lang="es" class="theme-dark" data-theme="dark" data-palette="contapyme">
<head>
  <meta charset="UTF-8">
  <script src="../preview-boot.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>tk-timeline · demo</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/Jeff-Aporta/is-webcomponents@main/dist/cdn/is-base.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/Jeff-Aporta/is-webcomponents@main/dist/cdn/palettes.min.css">
  <link rel="stylesheet" href="../styles/preview.css">
  <script type="module" src="https://cdn.jsdelivr.net/gh/Jeff-Aporta/is-webcomponents@main/dist/cdn/all.min.js"></script>
  <script type="module" src="../../../../dist/cdn/tk.all.js"></script>
  <script type="module" src="../preview-chrome.js"></script>
</head>
<body>
  <main class="demo">
    <header>
      <h1>&lt;tk-timeline&gt;</h1>
      <p>Bloque <code>timeline</code> / <code>metrics-timeline</code>. Cifras hábiles arriba (<code>resumen</code>) y línea de tiempo con <code>is-timeline</code> si hay ≥ 2 fechas válidas.</p>
    </header>

    <section class="demo">
      <h2>Demo en vivo</h2>
      <div class="marco">
        <tk-timeline id="tl"></tk-timeline>
      </div>
    </section>

    <script type="module">
      document.getElementById('tl').payload = {
        title: 'Hitos del cambio',
        resumen: [
          { label: 'Archivos tocados', value: '14', highlight: true },
          { label: 'Queries migradas', value: '11' },
          { label: 'Líneas ±', value: '+342 / −285' },
        ],
        timeline: {
          milestones: [
            { id: 'h1', label: 'Reporte', iso: '2026-08-04T08:00:00Z', hora: '08:00', desc: 'usuario reporta 503' },
            { id: 'h2', label: 'Diagnóstico', iso: '2026-08-04T09:30:00Z', hora: '09:30', desc: 'cambio a D1 reciente' },
            { id: 'h3', label: 'Adapter', iso: '2026-08-04T11:00:00Z', hora: '11:00', desc: 'quitar, ir nativo' },
            { id: 'h4', label: 'Deploy', iso: '2026-08-04T17:00:00Z', hora: '17:00', desc: 'todos los tickets OK' },
          ],
        },
      };
    </script>
  </main>
</body>
</html>
