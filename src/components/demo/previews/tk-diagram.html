<!DOCTYPE html>
<html lang="es" class="theme-dark" data-theme="dark" data-palette="contapyme">
<head>
  <meta charset="UTF-8">
  <script src="../preview-boot.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>tk-diagram · demo</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/Jeff-Aporta/is-webcomponents@1c0e451393a412c2c5a41d1d4d4a2e62aa662bda/dist/cdn/is-base.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/Jeff-Aporta/is-webcomponents@1c0e451393a412c2c5a41d1d4d4a2e62aa662bda/dist/cdn/palettes.min.css">
  <link rel="stylesheet" href="../styles/preview.css">
  <script type="module" src="https://cdn.jsdelivr.net/gh/Jeff-Aporta/is-webcomponents@1c0e451393a412c2c5a41d1d4d4a2e62aa662bda/dist/cdn/all.min.js"></script>
  <script type="module" src="../../../../dist/cdn/tk.all.js"></script>
  <script type="module" src="../preview-chrome.js"></script>
</head>
<body>
  <main class="demo">
    <header>
      <h1>&lt;tk-diagram&gt;</h1>
      <p>Bloque <code>diagram</code>. Diagrama en fuente Mermaid. Se renderiza vía <code>mermaid.ink</code> — sin empaquetar el motor. Si el servicio cae, la fuente queda disponible en <code>is-details</code>.</p>
    </header>

    <section class="demo">
      <h2>Demo en vivo</h2>
      <div class="marco">
        <tk-diagram id="d"></tk-diagram>
      </div>
    </section>

    <script type="module">
      document.getElementById('d').payload = {
        title: 'Flujo del fix',
        engine: 'mermaid',
        source: 'flowchart LR\n  A[Usuario] -->|GET /tickets| B(Worker)\n  B -->|json_agg| C[D1]\n  C -->|SQLITE_ERROR| B\n  B -->|json_group_array| C\n  C -->|tickets| B\n  B -->|200 OK| A',
        sourceDark: 'flowchart LR\n  A[Usuario] -->|GET /tickets| B(Worker)\n  B -->|json_agg| C[D1]\n  C -->|SQLITE_ERROR| B\n  B -->|json_group_array| C\n  C -->|tickets| B\n  B -->|200 OK| A',
        alt: 'Diagrama del flujo del fix',
        caption: 'El cambio de sintaxis resuelve el 503 sin migrar datos.',
      };
    </script>
  </main>
</body>
</html>
