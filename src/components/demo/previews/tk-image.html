<!DOCTYPE html>
<html lang="es" class="theme-dark" data-theme="dark" data-palette="contapyme">
<head>
  <meta charset="UTF-8">
  <script src="../preview-boot.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>tk-image · demo</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/Jeff-Aporta/is-webcomponents@main/dist/cdn/is-base.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/Jeff-Aporta/is-webcomponents@main/dist/cdn/palettes.min.css">
  <link rel="stylesheet" href="../styles/preview.css">
  <script type="module" src="https://cdn.jsdelivr.net/gh/Jeff-Aporta/is-webcomponents@main/dist/cdn/all.min.js"></script>
  <script type="module" src="../../../../dist/cdn/tk.all.js"></script>
  <script type="module" src="../preview-chrome.js"></script>
</head>
<body>
  <main class="demo">
    <header>
      <h1>&lt;tk-image&gt;</h1>
      <p>Bloque <code>image</code> (singular) o <code>image-group</code> (rejilla). Al hacer clic la evidencia se abre en <code>is-lightbox</code> (zoom y paneo).</p>
    </header>

    <section class="demo">
      <h2>Imagen (un solo item)</h2>
      <div class="marco">
        <tk-image id="i1"></tk-image>
      </div>
    </section>

    <section class="demo">
      <h2>Grupo de imágenes</h2>
      <div class="marco">
        <tk-image id="i2"></tk-image>
      </div>
    </section>

    <script type="module">
      document.getElementById('i1').payload = {
        title: 'Evidencia principal',
        url: 'https://placehold.co/640x360/1a6eb0/fff?text=stack+trace',
        alt: 'Captura del log con el error 503',
        caption: 'Error 503 al listar tiquetes (logging del worker).',
      };
      // image-group: pasar `bloques` con varias figuras hijas.
      const fig = document.getElementById('i2');
      fig.bloques = [
        { kind: 'image', payload: { url: 'https://placehold.co/480x270/1a6eb0/fff?text=before', alt: 'Antes', caption: 'Antes del deploy' } },
        { kind: 'image', payload: { url: 'https://placehold.co/480x270/2f9e44/fff?text=after',  alt: 'Después', caption: 'Después del fix' } },
      ];
    </script>
  </main>
</body>
</html>
