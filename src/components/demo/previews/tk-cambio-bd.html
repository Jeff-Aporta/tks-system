<!DOCTYPE html>
<html lang="es" class="theme-dark" data-theme="dark" data-palette="contapyme">
<head>
  <meta charset="UTF-8">
  <script src="../preview-boot.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>tk-cambio-bd · demo</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/Jeff-Aporta/is-webcomponents@1c0e451393a412c2c5a41d1d4d4a2e62aa662bda/dist/cdn/is-base.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/Jeff-Aporta/is-webcomponents@1c0e451393a412c2c5a41d1d4d4a2e62aa662bda/dist/cdn/palettes.min.css">
  <link rel="stylesheet" href="../styles/preview.css">
  <script type="module" src="https://cdn.jsdelivr.net/gh/Jeff-Aporta/is-webcomponents@1c0e451393a412c2c5a41d1d4d4a2e62aa662bda/dist/cdn/all.min.js"></script>
  <script type="module" src="../../../../dist/cdn/tk.all.js"></script>
  <script type="module" src="../preview-chrome.js"></script>
</head>
<body>
  <main class="demo">
    <header>
      <h1>&lt;tk-cambio-bd&gt;</h1>
      <p>Bloque <code>cambio-bd</code>. Cabecera con tabla/registro, intención en prosa y el SQL destacado. Es el bloque con más peso operativo del tiquete.</p>
    </header>

    <section class="demo">
      <h2>Demo en vivo</h2>
      <div class="marco">
        <tk-cambio-bd id="cb"></tk-cambio-bd>
      </div>
    </section>

    <script type="module">
      document.getElementById('cb').payload = {
        title: 'Migración: adapter → SQLite nativo',
        tabla: 'isadoc_tk_ticket',
        registro: 'queries con json_agg',
        intencion: 'Reemplaza el adapter parcial (Postgres→D1) por queries nativas de SQLite. **No** requiere migración de datos: solo cambia la sintaxis de las queries de lectura.',
        sql: 'SELECT json_group_array(json_object(\'id\', t."ITICKET", \'titulo\', t."TITULO")) AS tickets FROM isadoc_tk_ticket t;',
      };
    </script>
  </main>
</body>
</html>
