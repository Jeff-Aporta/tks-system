    <header>
      <h1>&lt;tk-markdown&gt;</h1>
      <p>Bloque <code>markdown</code> del tiquete. Acepta <code>text</code>, <code>body</code> o <code>content</code>; opcional <code>title</code>.</p>
    </header>

    <section class="demo">
      <h2>Demo en vivo</h2>
      <div class="marco">
        <tk-markdown id="md"></tk-markdown>
      </div>
    </section>

    <script type="module">
      document.getElementById('md').payload = {
        title: 'Solicitud',
        text: 'El worker devuelve **503** desde el deploy del 04-08-2026. El log muestra:\n\n- `tbl: BD_ISADOC.TK_TICKET`\n- `near "SELECT": syntax error`\n- Afecta **ambos** spaces (patyia, clientesis).\n\nDespués del cambio a D1, las queries con `json_agg` no compilan en SQLite. La página `/api/tk/.../tickets` cae con error 500.',
      };

  </main>
