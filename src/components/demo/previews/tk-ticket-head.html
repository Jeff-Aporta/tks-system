<!DOCTYPE html>
<html lang="es" class="theme-dark" data-theme="dark" data-palette="contapyme">
<head>
  <meta charset="UTF-8">
  <script src="../preview-boot.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>tk-ticket-head · demo</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/Jeff-Aporta/is-webcomponents@main/dist/cdn/is-base.min.css">

<body>
  <main class="demo">

      <h1>&lt;tk-ticket-head&gt;</h1>
      <p>Cabecera del tiquete: código, título, estado, ámbito (PatyIA / Clientes), solicitante, cifras de tiempo y resumen.</p>

    <section class="demo">
      <h2>Demo en vivo</h2>
      <div class="marco">
        <tk-ticket-head id="cabeza"></tk-ticket-head>

    <script type="module">
      document.getElementById('cabeza').ticket = {
        iticket: 'TK-000123',
        space: 'patyia',
        titulo: 'Migración del worker a D1 con SQLite nativo',
        estado: 'completado',
        solicitante: 'Jeff Aporta',
        fechaSolicitud: '2026-07-30',
        fechaEntrega: '2026-08-04',
        tiempoTotalMinutos: 540,
        diligenciaMinutos: 480,
        rootCommits: [],
        resumen: 'Reemplaza el adapter parcial de Postgres→D1 por queries nativas de SQLite (`json_group_array`, `MAX`, `strftime`).',
      };
    </script>
  </main>
