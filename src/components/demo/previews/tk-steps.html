<!DOCTYPE html>
<html lang="es" class="theme-dark" data-theme="dark" data-palette="contapyme">
<head>
  <meta charset="UTF-8">
  <script src="../preview-boot.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>tk-steps · demo</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/Jeff-Aporta/is-webcomponents@main/dist/cdn/is-base.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/Jeff-Aporta/is-webcomponents@main/dist/cdn/palettes.min.css">
  <link rel="stylesheet" href="../styles/preview.css">
  <script type="module" src="https://cdn.jsdelivr.net/gh/Jeff-Aporta/is-webcomponents@main/dist/cdn/all.min.js"></script>
  <script type="module" src="../../../../dist/cdn/tk.all.js"></script>
  <script type="module" src="../preview-chrome.js"></script>
</head>
<body>
  <main class="demo">
    <header>
      <h1>&lt;tk-steps&gt;</h1>
      <p>Bloque <code>steps</code> (alias: <code>phases</code>). Fases de análisis con sus hallazgos. Un item puede ser texto (markdown inline) o un bloque anidado.</p>
    </header>

    <section class="demo">
      <h2>Demo en vivo</h2>
      <div class="marco">
        <tk-steps id="s"></tk-steps>
      </div>
    </section>

    <script type="module">
      document.getElementById('s').payload = {
        title: 'Fases del análisis',
        phases: [
          {
            title: '1. Reproducción',
            items: [
              'Confirmar el 503 desde ambos spaces (`patyia`, `clientesis`).',
              'Identificar la query que rompe: `repository.ts` → `listar`.',
              { kind: 'badges', payload: { items: [{ tone: 'danger', label: 'Reproducible' }] } },
            ],
          },
          {
            title: '2. Causa',
            items: ['El adapter traduce solo parte de la sintaxis Postgres.', 'D1 (SQLite) no soporta `json_agg` / `BOOL_OR`.'],
          },
          {
            title: '3. Solución',
            items: [
              'Reemplazar `json_agg` por `json_group_array(json_object(...))`.',
              'Reemplazar `BOOL_OR` por `MAX(condición)`.',
              'Quitar el adapter: queries SQLite nativas desde el primer momento.',
            ],
          },
        ],
      };
    </script>
  </main>
</body>
</html>
